name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: The command you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `ppm doctor`
      render: text
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Your ppm.yml (optional)
      render: yaml
